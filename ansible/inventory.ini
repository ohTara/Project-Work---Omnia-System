[target]
vm-target ansible_host=10.0.1.10 ansible_user=azureuser

[waf]
vm-waf ansible_host=10.0.1.20 ansible_user=azureuser

[siem]
vm-siem ansible_host=10.0.1.30 ansible_user=azureuser

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'