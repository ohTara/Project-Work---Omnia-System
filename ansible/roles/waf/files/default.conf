server {
    listen 80;
    server_name _;

    # Attivazione ModSecurity
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/include.conf;

    location / {
        # Proxy verso la VM Target (OWASP Juice Shop)
        proxy_pass http://10.0.1.10:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom Error Page quando ModSecurity blocca un attacco (HTTP 403)
    error_page 403 /403.html;
    location = /403.html {
        internal;
        return 403 '{"error": "Access Denied by WAF (ModSecurity)"}';
    }
}